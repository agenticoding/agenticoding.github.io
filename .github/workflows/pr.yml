name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # Fast gate (no browser-contract suite — that stays on deploy); bounded so
    # a hang fails fast instead of sitting out the platform default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Audit responsive diagrams
        run: npm run audit:responsive-diagrams

      - name: Audit context regions
        run: npm run audit:context-regions

      - name: Lint audiobook dialogue
        run: npm run audio:dialogue:lint

      - name: Run linter
        run: npm run lint
